# ==============================================================================
# Kitty Configuration (Translated from ~/.config/ghostty/config)
# ==============================================================================

# --- Theme & Appearance ---
# include ./nord.conf
# include ./current-theme.conf
# hide_window_decorations yes

# --- Window Sizing & Padding ---
# 100 columns by 33 rows
remember_window_size  no
initial_window_width  100c
initial_window_height 30c
window_padding_width  5

# Background transparency (85% opacity)
background_opacity 0.85
dynamic_background_opacity yes


# --- Typography / Fonts ---
font_family      CaskaydiaMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Alternative font options from ghostty:
# font_family      Hack Nerd Font
# bold_font        auto
# italic_font      auto
# bold_italic_font auto

# --- Cursor ---
cursor_shape          block
cursor_blink_interval 0.5

# Prevent shell prompt from overriding cursor shape/blinking
shell_integration no-cursor

# --- Mouse Behavior ---
# Disable hiding mouse cursor while typing (0 disables hiding)
mouse_hide_wait 0

# --- Window Close Behavior ---
# Do not prompt for confirmation when closing the terminal window
confirm_os_window_close 0

# --- Keybindings ---
map ctrl+up   scroll_page_up
map ctrl+down scroll_page_down

# Alternative scroll by lines:
# map ctrl+up   scroll_line_up 5
# map ctrl+down scroll_line_down 5

# --- OS-Specific Overrides ---
# Silently ignored on Linux if the file does not exist
globinclude macos.conf

