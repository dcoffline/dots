[Unit]
After=graphical-session.target xdg-desktop-autostart.target xdg-desktop-portal.service
BindsTo=graphical-session.target
PartOf=graphical-session.target

[Service]
Environment="QT_PLUGIN_PATH=/home/linuxbrew/.linuxbrew/opt/qtbase/share/qt/plugins:/home/linuxbrew/.linuxbrew/share/qt/plugins"
ExecStartPre=
ExecStartPre=/var/home/eric/.local/bin/sunshine-wait-display
ExecStart=
ExecStart=/home/linuxbrew/.linuxbrew/opt/sunshine/bin/sunshine /var/home/eric/.config/sunshine/sunshine.conf capture=kwin
ExecStopPost=/var/home/eric/.local/bin/dpon
Restart=on-failure
RestartSec=5s
