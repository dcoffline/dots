- System:
    - Cockpit:
        icon: cockpit-light
        href: https://cockpit.hemati.com
        description: Bazzite Dashboard
        ping: http://192.168.1.18:9090
    - Cloudflare:
        icon: cloudflare
        href: https://dash.cloudflare.com/67304fcb508ed8114c9625fb9a98aff1/one/networks/connectors/cloudflare-tunnels/cloudflared/f675bd2e-853b-481a-8242-3dab60bfa54e/edit/public-hostname
