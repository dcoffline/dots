        server: podman
        container: cloudflared
- Servers:
    - Sunshine:
        icon: sunshine
        href: https://sunshine.hemati.com
        description: Remote Desktop
        ping: http://localhost:47990
    - Vaultwarden:
        icon: bitwarden
        href: https://vault.hemati.com
        description: Password Manager
        server: podman
        container: vaultwarden
- Security:
    - Pi-hole:
        icon: pi-hole
        href: https://pi.hemati.com/admin
        description: DNS & Ad-blocker
        ping: https://pi.hemati.com/admin
        widget:
          type: pihole
          url: http://host.containers.internal:8080
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"
          fields: ["queries", "blocked", "blocked_percent", "gravity"]
