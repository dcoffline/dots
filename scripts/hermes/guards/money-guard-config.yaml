# money-guard configuration
# Thresholds trigger alerts when spend crosses these levels.

# OpenRouter daily API spend threshold (USD)
openrouter_daily_warn: 2.00
openrouter_daily_critical: 5.00

# OpenRouter monthly API spend threshold (USD)
openrouter_monthly_warn: 15.00
openrouter_monthly_critical: 30.00

# Known monthly subscription costs (USD)
subscriptions:
  openrouter: 0.00       # pay-as-you-go, tracked via API usage
  google_workspace: 6.00 # Google Workspace individual
  ollama_cloud: 5.00     # Ollama Cloud plan
  discord_nitro: 9.99    # Discord Nitro
  # Add new subscriptions here as they're discovered

# Total monthly subscription budget (sum of subscriptions above)
subscription_monthly_warn: 25.00
subscription_monthly_critical: 50.00

# Paid model overuse detection
# Models on this list are "premium." If their usage ratio exceeds the threshold,
# an alert fires.
premium_models:
  - "openai/gpt-6-astra"
  - "openai/gpt-6-astra-pro"
  - "openai/gpt-6.1-sol-pro"
  - "openai/gpt-6-sol-pro"
  - "google/gemini-4-argon"
  - "deepseek/deepseek-v4-pro"
  - "anthropic/claude-opus-5.5"
  - "meta/muse-spark-1.3"
  - "nvidia/nemotron-3-ultra-550b-a55b"

paid_model_usage_warn_pct: 20.0   # warn if premium models > 20% of API calls
paid_model_usage_critical_pct: 40.0 # critical if > 40%

# Approved payment URLs (the "price list" — any payment URL found in vault
# content must be on this list or the guard fires)
approved_payment_urls:
  - "https://openrouter.ai"
  - "https://account.openrouter.ai/billing"
  - "https://workspace.google.com"
  - "https://discord.com"
  - "https://ollama.com"
  - "https://github.com/settings/billing"
  - "https://www.hemati.com"
  - "https://app.gohighlevel.com"
  - "https://www.salesflare.com"
  - "https://linear.app"

# Known models: what profile uses what model (populated from config)
profile_models:
  default: "deepseek/deepseek-v4-flash"
  pierce: "deepseek/deepseek-v4-flash"
  sable: "deepseek/deepseek-v4-flash"
  stan: "deepseek/deepseek-v4-flash"
  pax: "deepseek/deepseek-v4-flash"
  mikayla: "deepseek/deepseek-v4-flash"